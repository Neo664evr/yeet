[package]
name = "yeet"
version = "0.1.0"
edition = "2021"
description = "Windows 11-style End task for Windows 10 taskbar buttons"
license = "MIT"
repository = "https://github.com/Neo664evr/yeet"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
] }
